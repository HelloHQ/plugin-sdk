[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hellohq-plugin-sdk"
version = "0.2.0"
description = "SDK for building Tier 1 (Python) HelloHQ plugins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HelloHQ" }]
keywords = ["hellohq", "plugin", "sidecar"]

[project.urls]
Homepage = "https://github.com/HelloHQ/plugin-sdk"
Protocol = "https://github.com/HelloHQ/plugin-protocol"

[tool.hatch.build.targets.wheel]
packages = ["hellohq_plugin_sdk"]

# Self-contained pytest config so the SDK does not inherit a parent repo's
# pyproject (e.g. a workspace-root --cov addopts). CI passes --cov explicitly
# on the command line, where pytest-cov is installed.
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4.18", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hellohq_plugin_sdk"]
known-local-folder = ["propose_helpers"]
