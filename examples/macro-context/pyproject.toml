# Self-contained project for the macro-context example: tests + lint only.
# The plugin itself ships as ONE file (dist/plugin.py, see build.sh).
[project]
name = "hellohq-example-macro-context"
version = "0.1.0"
description = "Macro context example plugin (Tier-1 Python sidecar)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hellohq-plugin-sdk"]

[tool.uv.sources]
hellohq-plugin-sdk = { path = "../../sdks/python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["macro_context", "fixtures", "conftest", "bundle", "plugin"]
